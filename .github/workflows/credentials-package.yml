# The protocol package: tested here, and published from here.
#
# What this has to catch is not a broken build but a divergence. Both this
# package and any copy of it must agree with the ISSUER, and a disagreement
# does not present as a failing import -- it presents as credentials that do
# not verify, after they have been paid for. So the test job proves the package
# against a key document it generates, and then proves it again as a consumer
# resolves it: buyer/ imports it by name, through node_modules, against the key
# material scripts/gen-keys.sh actually produces.
name: credentials package

on:
  pull_request:
    paths:
      - 'packages/credentials/**'
      - 'buyer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/credentials-package.yml'
  push:
    branches: [main]
    # Publishing is tag-driven. The repository holds more than this package, so
    # the tag names it: credentials-v0.1.0.
    tags: ['credentials-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the floor the package declares; the current release is the one
        # that would break it first.
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build the package
        run: npm run build --workspace @toon-protocol/credentials

      - name: The protocol, against a generated key document
        run: npm test --workspace @toon-protocol/credentials

      # Dev key material. The buyer's test signs with the same epoch key the
      # issuer would load, which is the half the package's own tests cannot do.
      - name: Generate dev keys
        run: ./scripts/gen-keys.sh

      - name: The package as a consumer resolves it
        run: npm test --workspace @anytoon/buyer

      # What would actually be published. Node refuses to strip types under
      # node_modules, so a tarball without dist/ would install and then fail on
      # import -- this is where a missing file shows up, not at publish time.
      - name: Show the tarball contents
        run: npm pack --dry-run --workspace @toon-protocol/credentials

  publish:
    # Only ever from a tag, and only after the tests above.
    if: startsWith(github.ref, 'refs/tags/credentials-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is signed with an OIDC token, not with a secret. Without
      # this the publish fails rather than publishing unattested.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: The tag must name the version being published
        run: |
          tagged="${GITHUB_REF_NAME#credentials-v}"
          declared="$(node -p "require('./packages/credentials/package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, package.json says $declared" >&2
            exit 1
          fi

      # `prepublishOnly` in the package rebuilds and re-tests before the tarball
      # is made, so what ships is what this job just proved.
      - name: Publish
        run: npm publish --provenance --access public --workspace @toon-protocol/credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
