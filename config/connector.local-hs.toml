# The LOCAL REHEARSAL of the hidden-service ingress.
#
# connector.local.toml settles on anvil and is reached on loopback. THIS file
# settles on anvil and is reached ONLY at a `.anyone` hidden-service address --
# the same ingress `config/connector.toml` deploys, proved without spending real
# ANYONE on chain 1.
#
# That separation is the point. `make local-e2e` must stay fast and must not
# wait on a third-party anonymity network bootstrapping; `make hs-e2e` is where
# the circuit is exercised, deliberately and on demand.
#
# COMMITTED WITH A PLACEHOLDER HOST, rendered by scripts/hs-address.sh into
# config/.rendered/connector.local-hs.toml, which is what compose mounts.
# Used by `make hs-e2e`, through compose.local-hs.yml.

# The local-chain twin of connector.toml.
#
# Same routes, same decimal price, same operator surface -- but it settles on a
# local anvil instead of Ethereum mainnet.
#
# The base-unit `price` below differs from connector.toml and that is correct:
# the local mock USDC has 6 decimals where ANYONE has 18, so the same 0.01 is a
# different number of base units. What must match across both files is the
# DECIMAL price the minter signs and the issuer checks: 0.01.
# Used by `make local-up`, through compose.local.yml.
#
# Kept as a separate file because the connector reads exactly one TOML and has
# no include. When you change a route or a price in connector.toml, change it
# here too; `make local-e2e` is what catches the drift.

# The connector in front of the Anyone Protocol credentials issuer.
#
# This node terminates its own routes and does not peer: see
# docs/adr/0002-payment-reference-is-the-paying-channel-identity.md for why that
# matters. Because nobody forwards to us, we always collect, so X-TOON-Payer is
# always present on a delivery and the minter's fail-closed path is an assertion
# rather than a routine outcome. Adding a peer is the change that forces that
# decision to be revisited.

client_edge_addr = "0.0.0.0:3000"
state_dir = "/app/state"

# The HTTP carriage must be exposed: a client selects its transport from the
# carriages this node advertises, and "neither" leaves it with none to choose
# (the client fails with TRANSPORT_REQUIRED before it sends anything).
# Exposing a carriage is not peering: no peer is configured, so nothing
# forwards to us and we always collect our own payments.
peer_expose = "http"

[signer]
key_file = "/app/data/signer.key"

[node]
addresses = ["g.anyone.credentials"]
# THE HOST BELOW IS A PLACEHOLDER. scripts/hs-address.sh substitutes the address
# the `anon` daemon generated; the connector never reads that daemon's files
# (connector ADR 0070 decision 7). A placeholder ends in `.anyone` too, so this
# committed file still loads through the real parser.
#
# No `peer_allow_plaintext_endpoints`: the address IS the ed25519 key the circuit
# authenticates to, and `is_onion_endpoint` matches `.anyone` since issue #1284.
http_endpoint = "http://placeholderplaceholderplaceholderplaceholderplaceholdera.anyone/ilp"

# --- Routes -----------------------------------------------------------------
#
# PRICE COUPLING: 10000 base units / 10^6 (USDC decimals) = 0.01 USDC, which
# must equal the issuer's BUNDLE_PRICE exactly. The issuer verifies the amount
# inside the signed claim against its own BUNDLE_PRICE, so if these three drift
# -- this file, MINTER_BUNDLE_PRICE and ISSUER_BUNDLE_PRICE in compose.yml --
# every paid request returns 402 CLAIM_INVALID. Change all three together.

[[routes]]
prefix = "g.anyone.credentials"
handler_url = "http://claim-minter:8080/"
price = 10000

# The key document is free: a buyer needs the epoch key before it can blind
# anything, and charging for it makes the protocol undiscoverable.
#
# The handler_url is scoped to /v1/keys/ ON PURPOSE. A request target resolves
# BENEATH the handler path, so pointing this at the issuer root would let a
# caller reach v1/bundles at price = 0 and break the issuer's invariant I6
# ("no free class exists anywhere in this service"). Scoped here, `current` is
# the only reachable target, and `..` is refused before the app is touched.
[[routes]]
prefix = "g.anyone.credentials.keys"
handler_url = "http://issuer:3000/v1/keys/"
price = 0

# /healthz is deliberately NOT routed. The connector's own free, unauthenticated
# /ilp/identity is the public liveness signal; the issuer's health stays inside.

# The local anvil from the connector repository, not Base Sepolia. These two
# addresses are deterministic: DeployLocal.s.sol puts the registry and the mock
# USDC at the same place on every fresh chain. `connect` reads the token's own
# decimals() and refuses to start if this disagrees.
[settlement.evm]
rpc_url = "http://anvil:8545"
contract_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
token_address = "0x5FbDB2315678afecb367f032d93F642f64180aa3"
decimals = 6

[settlement.evm.key]
key_file = "/app/data/evm.key"

# Read endpoints need the bearer token; writes need an RFC 9421 signature from
# one of the write keys. redeem-latest lives here, which is how collected claims
# become on-chain money -- without it the node banks nothing. Reachable only on
# the compose network: this surface is never published.
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"
