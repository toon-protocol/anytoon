# Local-chain overlay: settle on anvil instead of Base Sepolia.
#
#   docker compose -f compose.yml -f compose.local.yml up -d
#   (or: make local-up)
#
# The chain is the connector repository's own anvil, which deploys the
# settlement contracts at deterministic addresses on start. Bring it up first:
#
#   git clone https://github.com/toon-protocol/connector
#   cd connector && make anvil-up
#
# That creates the compose project `connector`, whose network this joins so the
# connector reaches the chain by service name.

services:
  # NO INGRESS HERE. The local chain settles on anvil over loopback and the
  # buyer reaches the connector on 127.0.0.1, so there is nothing for an onion
  # service to do -- and a gate that waits on a third-party anonymity network
  # bootstrapping is a gate that goes red when that network has a bad day.
  # `make local-e2e` stays cold-passing and offline-ish for exactly that reason;
  # the connector repository keeps its own onion rehearsal off CI on the same
  # argument. A profile no invocation enables is how an overlay switches off a
  # service the base file defines.
  anon:
    profiles: ['never']
  anon-client:
    profiles: ['never']

  connector:
    volumes:
      - ./config/connector.local.toml:/app/config/connector.toml:ro
      - connector-keys:/app/data:ro
      - connector-state:/app/state
    # Mapping form, because the base file uses it to pin this container's IP on
    # `edge`. A list here would not merge onto that.
    networks:
      edge:
      backend:
      chain:

networks:
  chain:
    external: true
    name: connector_default
